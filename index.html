<title>指南山腳下</title>
<style>
:root{

*{box-sizing:border-box;touch-action:pan-x pan-y;-webkit-tap-highlight-color:transparent}
button{-webkit-user-select:none;user-select:none}
html,body{touch-action:pan-x pan-y;margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 "PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
#hud{position:sticky;top:0;z-index:5;background:var(--green);color:#f4efe3;box-shadow:var(--shadow)}
.hud-in{max-width:760px;margin:0 auto;padding:10px 16px}
.hud-top{display:flex;align-items:center;gap:10px}
.hud-phase{font-weight:700;font-size:17px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud-btn{background:rgba(255,255,255,.12);border:0;border-radius:8px;padding:4px 10px;color:#f4efe3;cursor:pointer;font-size:14px}
.prog{height:4px;background:rgba(255,255,255,.18);border-radius:4px;margin:8px 0 10px;overflow:hidden}
.prog i{display:block;height:100%;background:#e9c46a;border-radius:4px;transition:width .3s}
.chips{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px}
.chips b{font-weight:700;color:#fff}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px 14px;margin-top:8px;font-size:13px}
.stat{display:flex;align-items:center;gap:6px}
.stat span{width:30px;flex:none;opacity:.85}
.stat .bar{flex:1;height:6px;background:rgba(255,255,255,.18);border-radius:6px;overflow:hidden}
.stat .bar i{display:block;height:100%;background:#a8d5ba;border-radius:6px}
.stat em{font-style:normal;width:26px;text-align:right;font-variant-numeric:tabular-nums}
.hud-collapsed .stats{display:none}
main{max-width:760px;margin:0 auto;padding:18px 16px 60px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow);margin-bottom:14px}
h1{font-size:34px;line-height:1.2;margin:0 0 6px;letter-spacing:.04em}
h2{font-size:22px;margin:0 0 10px}
h3{font-size:17px;margin:16px 0 8px}
p{margin:0 0 10px}
.muted{color:var(--muted)}
.small{font-size:14px}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;background:var(--soft);color:var(--green);margin-right:4px;vertical-align:middle}
.tag.red{background:#f6e3dd;color:var(--accent)}
.tag.gold{background:#f5ead2;color:#8a6519}
.btn{display:block;width:100%;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:8px 0;cursor:pointer;transition:border-color .15s,transform .05s}
.btn:hover{border-color:var(--green2)}
.btn:active{transform:translateY(1px)}
.btn small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.btn.primary{background:var(--green);color:#fff;border-color:var(--green);text-align:center;font-weight:700}
.btn.primary:hover{background:#2c5a4b}
.btn.ghost{text-align:center;color:var(--green)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.rec{border:2px solid var(--gold)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1;min-width:140px}
label.f{display:block;font-size:14px;color:var(--muted);margin:12px 0 4px}
input[type=text],select,textarea{font-size:16px;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}
textarea{min-height:90px;font-size:13px;font-family:ui-monospace,Menlo,monospace}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:#fff;cursor:pointer;font-size:15px}
.opt.on{border-color:var(--green);background:var(--soft);color:var(--green);font-weight:700}
.alloc{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center}
.alloc .name small{display:block;color:var(--muted);font-size:12px}
.step{display:flex;align-items:center;gap:6px}
.step button{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:18px;line-height:1}
.step b{width:24px;text-align:center;font-variant-numeric:tabular-nums}
.big{font-size:28px;font-weight:800;color:var(--green)}
.fx{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.fx span{font-size:13px;padding:2px 8px;border-radius:8px;background:var(--soft);color:var(--green)}
.fx span.neg{background:#f6e3dd;color:var(--accent)}
.result-tier{font-weight:800;font-size:18px}
.t2{color:var(--gold)}.t1{color:var(--green2)}.t-1{color:#b0603f}.t-2{color:var(--accent)}
table.g{width:100%;border-collapse:collapse;font-size:14px}
table.g td,table.g th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}
table.g th{color:var(--muted);font-weight:500;white-space:nowrap}
table.g td.r{text-align:right;font-variant-numeric:tabular-nums}
.pbar{height:8px;background:#eee6d8;border-radius:8px;overflow:hidden;margin-top:6px}
.pbar i{display:block;height:100%;background:var(--green2)}
.share img{width:100%;border-radius:12px;border:1px solid var(--line);display:block}
.hero{background:var(--green);color:#f4efe3;border:0}
.hero h1{color:#fff}
.hero p{color:#dfe8e2}
.mountain{height:70px;margin:-4px -20px 10px;background:linear-gradient(170deg,transparent 52%,#2f5b4c 52.5%) ,linear-gradient(195deg,transparent 58%,#3a6d5a 58.5%);border-radius:0}
.foot{text-align:center;font-size:12px;color:var(--muted);margin-top:24px}
.panel{position:fixed;inset:0;background:rgba(20,20,15,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.panel .card{width:100%;max-width:760px;margin:0;border-radius:16px 16px 0 0;max-height:85vh;overflow:auto}
@media (min-width:640px){.panel{align-items:center}.panel .card{border-radius:16px}}
@media (max-width:420px){.stats{grid-template-columns:repeat(2,1fr)}h1{font-size:28px}}
</style>
</head>

 allowed=allowed.filter(i=>i>=from);
 if(!allowed.length)allowed=[nextSameTerm(parity,from)];
 const parts=[];
 if(sems>=2){const start=allowed[0];const suf=sems===2?['（上）','（下）']:['（一）','（二）','（三）'];const base=Math.floor(cr/sems);let rem=cr-base*sems;

 if(!A.ok&&S.extra<2){
  S.delayed=true;S.extra++;S.phases.splice(S.pi,0,{kind:'sem',y:5,t:S.extra});

 S.step='grad';S.sub={grad:{delay:false,audit:audit(),msgs}};save();render();

function abroadGpa(){const g=S.ex.gpas||[];let t=0,w=0;g.forEach(x=>{t+=x.gpa*x.cr;w+=x.cr;});return w?t/w:0;}
function careerLabel(n){return n==='交換校研究所'?`${S.ex.school||'交換學校'}研究所`:n;}
function cfill(t){return t.replace(/\{school\}/g,S.ex.school||'交換學校');}
function careerScore(name){const c=CAREERS[name];let s=0;for(const k in c.w)s+=S.st[k]*c.w[k];s+=(c.b?c.b():0)+S.luck-(S.delayed?2:0);return s;}
const CORP=['一般企業','金融與四大','外商企業','科技業','媒體與廣告'],ACAD=['研究所','交換校研究所','出國留學'];
// 學長姊內推（sr_ref）讓企業類職涯成功率 +3%；研究助理（ra）、教授推薦信（pf_rec）讓升學類分數各 +4
function careerProb(name){const c=CAREERS[name];const sc=careerScore(name)+(ACAD.includes(name)?(S.flags.includes('ra')?4:0)+(S.flags.includes('pf_rec')?4:0):0);
 return clamp(1/(1+Math.exp(-(sc-c.D)/5))+(S.flags.includes('sr_ref')&&CORP.includes(name)?0.03:0),0.05,0.95);}
function careerMenu(){const m=Object.keys(CAREERS).filter(n=>!CAREERS[n].gate||CAREERS[n].gate()).map(n=>({n,p:careerProb(n)}));
 const rec=m.reduce((a,b)=>b.p*CAREERS[b.n].v>a.p*CAREERS[a.n].v?b:a);return{m,rec:rec.n};}
function pickCareer(name){const {m,rec}=careerMenu();const prob=m.find(x=>x.n===name).p;const r=rand();
 const outcome=r<prob*0.25?2:r<prob?1:-1;const c=CAREERS[name];
 S.career={name:careerLabel(name),key:name,prob,rec:careerLabel(rec),recProb:m.find(x=>x.n===rec).p,outcome,title:cfill(outcome>0?c.ok[outcome===2?0:1]:c.ng[0]),text:outcome>0?'':cfill(c.ng[1])};
 S.log.push(`畢業｜選擇${careerLabel(name)}（成功率 ${Math.round(prob*100)}%）→ ${outcome===2?'大成功':outcome===1?'成功':'失敗'}`);
 S.step='careerResult';save();render();}

 const col=c.outcome===2?'#b5872c':c.outcome===1?'#3e7b63':'#c4553b';
 g.fillStyle=col;g.font=`700 30px ${F}`;g.fillText(`${c.name}・${c.outcome===2?'大成功':c.outcome===1?'成功':'失敗'}`,84,426);

 // GPA 折線

 const gs=S.gpas,x0=90,x1=570,y0=700,y1=920;g.strokeStyle='#e3dbcc';g.lineWidth=2;

function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
let CARD_URL=null;
function afterResult(){const box=$('#share-box');let cv=null;try{cv=drawCard();}catch(e){cv=null;}
 if(cv){try{CARD_URL=cv.toDataURL('image/png');box.innerHTML=`<img alt="畢業結算圖" src="${CARD_URL}">`;return;}catch(e){}}
 CARD_URL=null;box.innerHTML='<p class="muted small">這個瀏覽器無法產生圖片，請直接截圖下方資訊分享。</p>';}

/* ================= 操作 ================= */
function shareUrl(){return location.origin+location.pathname+'?seed='+encodeURIComponent(S.seed);}
function copyText(t){if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(()=>toast('已複製分享連結'),()=>prompt('複製這個連結：',t));else prompt('複製這個連結：',t);}
function toast(m){const p=$('#panel');p.innerHTML=`<div style="position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#23463b;color:#fff;padding:10px 16px;border-radius:10px;z-index:30">${esc(m)}</div>`;setTimeout(()=>{if(p.innerHTML.includes(m))p.innerHTML='';},1600);}
function openMenu(){$('#panel').innerHTML=`<div class="panel" data-act="closeMenu"><div class="card" data-stop="1"><h2>選單</h2>
 <label class="f">存檔碼（可貼到別的裝置繼續玩）</label><textarea readonly id="f-export">${esc(exportCode())}</textarea>
 <button class="btn" data-act="copyExport">複製存檔碼</button><button class="btn" data-act="restart">放棄這局，回到首頁</button><button class="btn ghost" data-act="closeMenu">關閉</button></div></div>`;}
function openImport(){$('#panel').innerHTML=`<div class="panel" data-act="closeMenu"><div class="card" data-stop="1"><h2>匯入存檔碼</h2>
 <textarea id="f-import" placeholder="貼上存檔碼"></textarea><button class="btn primary" data-act="doImport">匯入</button><button class="btn ghost" data-act="closeMenu">取消</button></div></div>`;}

const ACT={
 newForm(seed){CF={fp:{},name:'',gender:'男生',ptrait:'小太陽',group:null,college:'商學院',dept:'金融學系',admission:'個人申請',housing:'山上宿舍（奮進舍）',pref:'不限',seed:(seed||randomSeed()).toUpperCase().slice(0,8)};S={step:'create',phases:[],pi:0,_form:1};renderForm();},
 continue(){S=migrate(loadSave());render();},
 importForm(){openImport();},
 doImport(){try{const s=importCode($('#f-import').value);if(!s.phases)throw 0;S=migrate(s);$('#panel').innerHTML='';save();render();}catch(e){alert('存檔碼格式不正確');}},
 home(){S=null;render();},
 cf(arg){const [k,v]=arg.split('|');CF[k]=v;renderForm();},
 reseed(){CF.seed=randomSeed();CF.fp={};renderForm();},
 fp(arg){const [k,dv]=arg.split('|');const fp=CF.fp=CF.fp||{};const pts=seedPoints(cleanSeed(CF.seed));const used=Object.values(fp).reduce((a,b)=>a+b,0);if(+dv>0&&used>=pts)return;fp[k]=Math.max(0,(fp[k]||0)+(+dv));if(!fp[k])delete fp[k];renderForm();},
 create(){const seed=cleanSeed($('#f-seed').value);if(seed.length<4)return;const used=Object.values(CF.fp||{}).reduce((a,b)=>a+b,0);if(used!==seedPoints(seed))return;
  CF.seed=seed;CF.name=($('#f-name').value||'').trim();newGame(CF);},
 begin(){enterPhase();},
 hard(k){S.sub.hardKey=k;render();},
 coursesOk(){const law=S.dept==='法律學系';const map={涼課為主:.2,均衡:.5,硬課為主:.8};S.sub.hard=Math.max(map[S.sub.hardKey],law?.4:0);
  const fixed=S.sub.fixed||[];const fixedCr=fixed.reduce((a,c)=>a+c.cr,0);const i=semIdx(cur());
  S.sub.credits=clamp(S.sub.credits||20,Math.min(25,Math.max(fixedCr,minLoad(i))),Math.max(25,fixedCr));
  S.retake=S.retake.filter(r=>!fixed.some(c=>c.retake&&c.n===r.n));
  S.sub.courses=fixed.concat(pickElectives(i,Math.max(0,S.sub.credits-fixedCr)));
  goActs();},
 asel(a){const n=S.sub.picks;let sel=S.sub.acts||[];if(sel.includes(a))sel=sel.filter(x=>x!==a);else{if(sel.length>=n)sel=sel.slice(1);sel=sel.concat(a);
  if(selCost(sel)>S.money){toast(`存款不足：這些安排要花 ${selCost(sel).toLocaleString()} 元，目前只有 ${S.money.toLocaleString()} 元`);return;}}S.sub.acts=sel;render();},
 fpick(n){S.sub.frPick=n;render();},
 actsOk(){if((S.sub.acts||[]).length!==S.sub.picks)return;if((S.sub.acts||[]).includes('參加社團')&&!S.club){S.step='clubCat';save();render();return;}applyActs();},
 clubCat(k){S.sub.clubCat=k;S.step='clubPick';render();},clubBack(){S.step='clubCat';render();},
 clubPick(n){S.club={cat:S.sub.clubCat,name:n};S.log.push(`${phaseLabel(cur())}｜加入${n}`);applyActs();},
 actsDone(){actsDone();},crisis(i){const o=CRISIS_OPTS[+i];if(o.money&&!canPay(-o.money)){toast('存款不足，無法選擇這個方法');return;}resolveCrisis(+i);},
 opt(i){chooseOption(+i);},
 next(){if(S.sub.toResult){S.sub.toResult=false;S.step='result';save();render();return;}go();},
 settleOk(){finishSettle();},
 transfer(){doTransfer($('#f-transfer').value);},transferNo(){doTransfer(null);},
 minor(k){doMinor(k||null);},
 commPick(dpt){doCommPick(dpt);},
 exP(k){S.sub.exPlan=k;render();},exG(k){S.sub.exGroup=k;S.sub.exCountry=null;render();},exC(c){S.sub.exCountry=c;render();},exBack(){S.sub.exCountry=null;render();},
 exApply(ref){const sc=exSchool(ref);if(!canPay(exFee(sc)+5000)){toast(`存款不足：報名費 ${exFee(sc)} 元加保證金 5,000 元`);return;}doExchange(ref,S.sub.exPlan);},exSkip(){doExchange(null);},
 cadre(v){doCadre(!!v);},focus(f){doFocus(f);},leave(v){doLeave(!!v);},
 leaveDone(){applyFx({mood:60,money:10000});nextPhase();},
 bsel(a){const need=cur().kind==='win'?1:2;let sel=S.sub.sel||[];if(sel.includes(a))sel=sel.filter(x=>x!==a);else{if(sel.length>=need)sel=need===1?[]:sel.slice(1);sel=sel.concat(a);
  if(selCost(sel)>S.money){toast(`存款不足：這些安排要花 ${selCost(sel).toLocaleString()} 元，目前只有 ${S.money.toLocaleString()} 元`);return;}}S.sub.sel=sel;render();},
 bOk(){const p=cur(),win=p.kind==='win',sel=S.sub.sel||[];if(sel.length!==(win?1:2))return;S.sub.acts=sel;const list=[],msgs=[];
  list.push(...applyFx({mood:win?10:15}));
  sel.forEach(a=>{if(a==='實習'){const r=check('專業',16-(S.flags.includes('實習機會')?3:0));
    if(r.t>0){list.push(...applyFx({專業:4}));if(p.y===3)addFlag('實習');msgs.push('實習表現不錯，主管說隨時歡迎你回來。');}
    else{list.push(...applyFx({專業:1,mood:-4}));msgs.push('實習面試沒過，只找到一份打雜的短期工作。');}}
   else if(a==='陪伴愛人'){list.push(...applyFx(WIN_ACTS[a]&&win?WIN_ACTS[a]:SUM_ACTS[a]));}
   else if(a==='駕照補考')licenseTry(list,msgs);
   else{list.push(...applyFx((win?WIN_ACTS:SUM_ACTS)[a]));if(a==='暑修')msgs.push(summerSchool(p));if(a==='打工')S.tot.work++;}});
  let crisis=false;
  if(S.flags.includes('交往')){const chose=sel.includes('陪伴愛人');
   if(win){if(chose){const L=loveRound(true,8,'寒假你們一起去了好幾個地方。');list.push(...L.out);msgs.push(...L.msgs);}}
   else{const L=loveRound(chose,8,'這個暑假你們幾乎天天見面。');list.push(...L.out);msgs.push(...L.msgs);crisis=L.crisis;}}
  list.push(...cohabitTick());S.sub.blist=list;S.sub.bmsgs=msgs;S.q=(crisis?['crisis']:[]).concat(win?['ev']:['ev','ev']).concat('breakSettle');go();},
 bSettleOk(){nextPhase();},
 abOk(){goActs();},
 delayGo(){enterPhase();},
 toCareer(){S.step='career';save();render();},
 career(n){pickCareer(n);},
 toResult(){S.step='result';save();render();},
 afterCareer(){if(S.flags.includes('交往')&&S.npc.cr){S.step='proposal';save();render();}else{S.step='result';save();render();}},
 propose(v){doPropose(!!v);},
 download(){if(!CARD_URL){alert('這個瀏覽器無法產生圖片');return;}const a=document.createElement('a');a.href=CARD_URL;a.download=`指南山腳下_${S.name}_${S.seed}.png`;document.body.appendChild(a);a.click();a.remove();},
 copyLink(){copyText(shareUrl());},
 again(){clearSave();S=null;history.replaceState&&history.replaceState(null,'',location.pathname);render();},
 toggleHud(){localStorageSet('zhinan-hud',localStorageGet('zhinan-hud')==='c'?'o':'c');renderHud();},
 menu(){openMenu();},closeMenu(){$('#panel').innerHTML='';},
 copyExport(){copyText(exportCode());},
 restart(){if(confirm('確定要放棄這一局嗎？')){clearSave();S=null;$('#panel').innerHTML='';render();}}
};

document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});

['gesturestart','gesturechange','gestureend'].forEach(t=>document.addEventListener(t,e=>e.preventDefault(),{passive:false}));

 if(b.classList.contains('panel')&&e.target!==b)return;

document.addEventListener('input',e=>{
 if(e.target.id==='f-credits'){S.sub.credits=+e.target.value;const fc=(S.sub.fixed||[]).reduce((a,c)=>a+c.cr,0);const l=e.target.previousElementSibling;if(l)l.innerHTML=`本學期總學分：<b>${S.sub.credits}</b>（加選 ${Math.max(0,S.sub.credits-fc)} 學分系選修）`;}
 if(e.target.id==='f-abcredits'){S.sub.credits=+e.target.value;const l=e.target.previousElementSibling;if(l)l.innerHTML=`修課學分：<b>${S.sub.credits}</b>`;}
 if(e.target.id==='f-name')CF.name=e.target.value;
 if(e.target.id==='f-seed')CF.seed=e.target.value.toUpperCase();});
document.addEventListener('change',e=>{if(e.target.id==='f-seed'){CF.seed=cleanSeed(e.target.value);CF.fp={};renderForm();}});
document.addEventListener('change',e=>{
 if(e.target.id==='f-college'){CF.college=e.target.value;CF.dept=DEPTS.find(x=>x[0]===CF.college)[1];renderForm();}
 if(e.target.id==='f-dept'){CF.dept=e.target.value;CF.group=GROUPS[CF.dept]?GROUPS[CF.dept][0]:null;renderForm();}});
render();
